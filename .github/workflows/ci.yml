name: CloudX Store CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v
 
  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Tag Docker images
        run: |
          docker tag cloudx-store-frontend \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-frontend:latest

          docker tag cloudx-store-frontend \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-frontend:${{ github.sha }}

          docker tag cloudx-store-backend \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-backend:latest

          docker tag cloudx-store-backend \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-backend:${{ github.sha }}

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-frontend:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudx-store-backend:${{ github.sha }}
   
